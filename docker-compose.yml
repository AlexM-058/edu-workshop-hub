services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      FRONTEND_URLS: http://localhost:5173,http://127.0.0.1:5173
      CLERK_AUTHORIZED_PARTIES: http://localhost:5173,http://127.0.0.1:5173
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: edu_workshop_hub
      DB_USERNAME: edu_workshop_hub
      DB_PASSWORD: secret
    networks:
      - appnet
    depends_on:
      db:
        # Wait until Postgres is actually ready to accept connections,
        # not just until the container has started.
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - ./docker:/docker:ro
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    networks:
      - appnet
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu_workshop_hub
      POSTGRES_USER: edu_workshop_hub
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - appnet
    # Probe the database with pg_isready so dependent services only start
    # after Postgres is genuinely accepting connections on the right database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_workshop_hub -d edu_workshop_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    # Pinned to 9.15 (released 2026-05-11).
    # Includes fixes for CVE-2026-7813 through CVE-2026-7820.
    # To upgrade: update the tag, run `docker compose --profile dev pull pgadmin`,
    # then restart with `docker compose --profile dev up -d pgadmin`.
    image: dpage/pgadmin4:9.15
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret
      # Disable the login splash screen in dev for faster access
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy
    # pgAdmin is a dev-only tool; prevent accidental production use
    profiles:
      - dev

volumes:
  postgres-data:
  pgadmin-data:

networks:
  appnet:
    driver: bridge
